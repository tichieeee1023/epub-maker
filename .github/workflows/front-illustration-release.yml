name: Build and release EPUB Maker 1.3.0

on:
  push:
    branches:
      - feature/front-illustration-v1.3.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Syntax verification
        run: python -m compileall -q builder.py config.py gui.py main.py tests
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
      - name: Package Windows EXE
        run: pyinstaller --noconfirm --clean epub_maker.spec
      - name: Check Windows binary and create ZIP
        shell: pwsh
        run: |
          $exe = "dist/EPUB Maker.exe"
          if (-not (Test-Path $exe)) { throw "EXE was not created" }
          $data = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($data.Length -lt 4000000) { throw "EXE is unexpectedly small" }
          if ($data[0] -ne 0x4D -or $data[1] -ne 0x5A) { throw "EXE has incorrect header" }
          Compress-Archive -Path $exe -DestinationPath "EPUB-Maker-1.3.0.zip" -Force
      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Maker-1.3.0-Windows
          path: EPUB-Maker-1.3.0.zip
          if-no-files-found: error
      - name: Publish v1.3.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.0 "EPUB-Maker-1.3.0.zip" --target "$env:GITHUB_SHA" --title "EPUB Maker 1.3.0" --notes "표지 바로 뒤에 선택한 삽화 한 장을 독립 페이지로 삽입하는 기능이 추가되었습니다. JPG/JPEG/PNG 지원, 비율 유지, 선택 해제 기능 및 설정 자동 저장. 삽화를 선택하지 않으면 기존 EPUB 형식은 그대로 유지됩니다. Windows 64비트용 ZIP의 EPUB Maker.exe를 실행하세요. 실제 리디 앱에서의 화면 배치는 별도 확인이 필요합니다."
