<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ko" xml:lang="ko">
<head>
    <title>{{ book_title }} {{ volume_number }}권</title>
</head>
<body>
    <section class="title-page title-page--editorial">
        <p class="title-eyebrow">{{ book_english_title }}</p>
        <h1 class="work-title">{{ book_title }}</h1>
        <p class="original-title">{{ book_original_title }}</p>
        <p class="korean-title">{{ book_korean_title }}</p>
        <div class="title-rule"></div>
        <p class="volume-wrapper"><span class="volume-label">{{ volume_number }}권</span></p>
        <p class="author">{{ author_korean }}</p>
    </section>
</body>
</html>
